# Runs on every push to master (i.e. after a PR is merged).
# Determines the version bump from Conventional Commits since the last tag,
# then bumps package.json, tags, and pushes.
#
# Bump rules:
#   - `BREAKING CHANGE` in body, or `type!:` in the header -> major
#   - `feat:`                                              -> minor
#   - `fix:`                                               -> patch
#   - anything else (chore/docs/refactor/ci/test/...)      -> no release
#
# The version-bump commit/tag is pushed with GITHUB_TOKEN, which does NOT
# re-trigger workflows, so there is no release loop.

name: Auto Release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      revert_bump:
        description: 'Reviewed bump for unresolved reverts (does not lower other changes)'
        type: choice
        default: auto
        options: [auto, none, patch, minor, major]

permissions:
  contents: write

# Never run two releases at once.
concurrency:
  group: auto-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags for commit analysis
          token: ${{ secrets.RELEASE_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - name: Decide version bump from Conventional Commits
        id: bump
        env:
          RELEASE_REVERT_BUMP: ${{ inputs.revert_bump != 'auto' && inputs.revert_bump || '' }}
        run: |
          node --test scripts/release-bump.test.mjs
          node scripts/release-bump.mjs

      - name: Test + build
        if: steps.bump.outputs.bump != 'none'
        run: |
          npm run test
          npm run build

      - name: Bump version, commit and tag
        if: steps.bump.outputs.bump != 'none'
        id: version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Published version tags are immutable; resolve partial releases manually.
          CURRENT="$(node -p "require('./package.json').version")"
          case "${{ steps.bump.outputs.bump }}" in
            major) NEW="$(awk -F. '{print $1+1".0.0"}' <<< "$CURRENT")" ;;
            minor) NEW="$(awk -F. '{print $1"."$2+1".0"}' <<< "$CURRENT")" ;;
            patch) NEW="$(awk -F. '{print $1"."$2"."$3+1}' <<< "$CURRENT")" ;;
          esac
          if git show-ref --verify --quiet "refs/tags/v$NEW"; then
            echo "Tag v$NEW already exists; refusing to replace it."
            exit 1
          fi

          NEW_VERSION="$(npm version ${{ steps.bump.outputs.bump }} -m 'chore(release): %s [skip ci]')"
          echo "version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          git push --follow-tags
